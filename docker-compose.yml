version: '3.8'

services:
  web:
    build: .
    image: sqllabs
    container_name: sqllabs
    restart: always
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-django-insecure-0n4jgybowssgkv%3dp(pue2xg$hhs90i=-$1$8t7-1((achzb0}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - PORT=8000
    volumes:
      - sqlite_data:/app/data
    ports:
      - "${PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  sqlite_data:
    name: sqllabs-data